[package]
name = "phonon-studio"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Desktop AI Podcast & Voice Studio built on the Phonon audio engine"
keywords = ["audio", "gui", "dioxus", "podcast", "phonon"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
blake3.workspace = true
dioxus.workspace = true
dioxus-logger.workspace = true
dioxus-shadcn = { version = "0.7.0", default-features = false, features = [
  "badge",
  "button",
  "card",
  "dialog",
  "empty",
  "input",
  "label",
  "native-select",
  "resizable",
  "select",
  "separator",
  "slider",
  "sonner",
  "switch",
  "tabs",
  "textarea",
  "tooltip",
] }
dirs.workspace = true
phonon-ai.workspace = true
phonon-core.workspace = true
phonon-engine.workspace = true
phonon-io = { workspace = true, features = ["aac"] }
phonon-podcast.workspace = true
phonon-wav.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
